# 应用配置
spring.application.name=yitaohui
server.port=8080

# 数据库配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/yitaohui?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.yitaohui.model
mybatis.configuration.map-underscore-to-camel-case=true

# 日志配置
logging.level.com.yitaohui=debug

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# 静态资源配置
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/,file:./upload/

# 上传文件保存路径
file.upload.path=./upload/
file.upload.url=http://localhost:8080/static/ 